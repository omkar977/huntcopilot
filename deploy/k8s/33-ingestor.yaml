apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestor
  namespace: huntcopilot
  labels:
    app.kubernetes.io/name: ingestor
    app.kubernetes.io/part-of: huntcopilot
    app.kubernetes.io/component: ingestor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ingestor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestor
        app.kubernetes.io/part-of: huntcopilot
        app.kubernetes.io/component: ingestor
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ingestor
          image: huntcopilot/ingestor:dev
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8301}
          envFrom:
            - configMapRef: {name: hc-config}
            - secretRef: {name: hc-secrets}
          resources:
            requests: {cpu: 100m, memory: 100Mi}
            limits: {cpu: "1", memory: 200Mi}
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: ingestor
  namespace: huntcopilot
  labels:
    app.kubernetes.io/name: ingestor
    app.kubernetes.io/part-of: huntcopilot
    app.kubernetes.io/component: ingestor
spec:
  selector:
    app.kubernetes.io/name: ingestor
  ports:
    - name: http
      port: 8301
      targetPort: http
