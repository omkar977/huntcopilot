apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: huntcopilot
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: huntcopilot
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard
        app.kubernetes.io/part-of: huntcopilot
        app.kubernetes.io/component: dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: huntcopilot/dashboard:dev
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8501}
          envFrom:
            - configMapRef: {name: hc-config}
            - secretRef: {name: hc-secrets}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 500Mi}
          livenessProbe:
            httpGet: {path: /_stcore/health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            httpGet: {path: /_stcore/health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: huntcopilot
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: huntcopilot
    app.kubernetes.io/component: dashboard
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: dashboard
  ports:
    - name: http
      port: 8501
      targetPort: http
      nodePort: 30501
