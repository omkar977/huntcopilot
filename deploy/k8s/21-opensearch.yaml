# Single-node OpenSearch. The node must have vm.max_map_count=262144 (set it on the host, see spec Appendix N).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  namespace: huntcopilot
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/part-of: huntcopilot
    app.kubernetes.io/component: opensearch
spec:
  replicas: 1
  serviceName: opensearch
  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch
        app.kubernetes.io/part-of: huntcopilot
        app.kubernetes.io/component: opensearch
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.17.1
          ports:
            - {name: http, containerPort: 9200}
          env:
            - {name: discovery.type, value: single-node}
            - {name: DISABLE_SECURITY_PLUGIN, value: "true"}
            - {name: DISABLE_INSTALL_DEMO_CONFIG, value: "true"}
            - {name: OPENSEARCH_JAVA_OPTS, value: "-Xms512m -Xmx512m"}
            - {name: bootstrap.memory_lock, value: "false"}
          resources:
            requests: {cpu: 500m, memory: 1000Mi}
            limits: {cpu: "2", memory: 1200Mi}
          livenessProbe:
            httpGet: {path: "/_cluster/health?local=true", port: http}
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet: {path: "/_cluster/health?local=true", port: http}
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: os-data, mountPath: /usr/share/opensearch/data}
  volumeClaimTemplates:
    - metadata:
        name: os-data
        labels:
          app.kubernetes.io/name: opensearch
          app.kubernetes.io/part-of: huntcopilot
          app.kubernetes.io/component: opensearch
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: huntcopilot
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/part-of: huntcopilot
    app.kubernetes.io/component: opensearch
spec:
  selector:
    app.kubernetes.io/name: opensearch
  ports:
    - name: http
      port: 9200
      targetPort: http
