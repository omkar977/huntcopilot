# Optional: MLflow tracking UI. Skip this file if you do not need the UI.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: huntcopilot
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: huntcopilot
    app.kubernetes.io/component: mlflow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
        app.kubernetes.io/part-of: huntcopilot
        app.kubernetes.io/component: mlflow
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mlflow
          image: huntcopilot/mlflow:dev
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 5000}
          envFrom:
            - configMapRef: {name: hc-config}
          resources:
            requests: {cpu: 50m, memory: 150Mi}
            limits: {cpu: 500m, memory: 300Mi}
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 35
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: hc-data}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: huntcopilot
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: huntcopilot
    app.kubernetes.io/component: mlflow
spec:
  selector:
    app.kubernetes.io/name: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: http
