apiVersion: apps/v1
kind: Deployment
metadata:
  name: generator
  namespace: huntcopilot
  labels:
    app.kubernetes.io/name: generator
    app.kubernetes.io/part-of: huntcopilot
    app.kubernetes.io/component: generator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generator
        app.kubernetes.io/part-of: huntcopilot
        app.kubernetes.io/component: generator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: generator
          image: huntcopilot/generator:dev
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8300}
          envFrom:
            - configMapRef: {name: hc-config}
            - secretRef: {name: hc-secrets}
          resources:
            requests: {cpu: 100m, memory: 150Mi}
            limits: {cpu: "1", memory: 300Mi}
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: hc-data}
---
apiVersion: v1
kind: Service
metadata:
  name: generator
  namespace: huntcopilot
  labels:
    app.kubernetes.io/name: generator
    app.kubernetes.io/part-of: huntcopilot
    app.kubernetes.io/component: generator
spec:
  selector:
    app.kubernetes.io/name: generator
  ports:
    - name: http
      port: 8300
      targetPort: http
