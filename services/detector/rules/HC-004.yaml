id: HC-004
name: Remote execution tool with remote target
description: 'psexec.exe, wmic.exe or winrs.exe used with a UNC path, /node: or -r: target.'
severity: 4
mitre:
  tactics: [Lateral Movement, Execution]
  techniques: [T1021.002, T1047]
type: single
group_by: [host]
where:
  - {field: event_type, op: eq, value: process_create}
  - {field: process.name, op: in, value: [psexec.exe, wmic.exe, winrs.exe]}
  - {field: process.cmdline, op: regex, value: '\\\\[A-Za-z0-9._-]+|/node:|(?:^|\s)-r:'}
exclusions:
  - - {field: host, op: eq, value: WS-08}
    - {field: user, op: eq, value: adm_it}
